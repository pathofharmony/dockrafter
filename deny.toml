[advisories]
version = 2
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "AGPL-3.0-only",
]
confidence-threshold = 0.8
# zenpdf (PDF rasterization) is AGPL-3.0 — see LICENSE-NOTES.md
exceptions = [
    { crate = "zenpdf", allow = ["AGPL-3.0-only", "LicenseRef-Imazen-Commercial"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
