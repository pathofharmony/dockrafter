[package]
name = "docrafter-cli"
readme = "../../README.md"
description = "CLI for docrafter (PDF merge, OCR text, office export) — installs as `docrafter`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "docrafter"
path = "src/main.rs"

[features]
default = ["ocr"]
ocr = ["docrafter/ocr", "dep:image"]

[dependencies]
docrafter.workspace = true
docrafter-core.workspace = true
clap.workspace = true
image = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
docrafter-pdf-write.workspace = true

[lints]
workspace = true
